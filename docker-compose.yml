version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: sim_sms_gateway_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms_gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sms_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sim_sms_gateway_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres_secure_password@db:5432/sms_gateway"
      SECRET_KEY: "production-secret-key-replace-with-env"
      ENVIRONMENT: "production"
      DEBUG: "false"
      DEFAULT_COUNTRY_CODE: "+255"
      WEBHOOK_ALLOW_LOCAL_URLS: "false"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sim_sms_gateway_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres_secure_password@db:5432/sms_gateway"
      SECRET_KEY: "production-secret-key-replace-with-env"
      ENVIRONMENT: "production"
    command: python -m app.workers.webhook_worker

volumes:
  postgres_data:
